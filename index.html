<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyFlow – Focus Timer & Study Dashboard</title>
    <meta name="color-scheme" content="dark" />
    <meta name="build-time" content="2026-06-08T22:20Z" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap">
    <style>
    #loading-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #f8fafc; color: #6366f1;
      font-family: "Outfit", "Inter", system-ui, sans-serif;
      transition: opacity 0.4s;
    }
    @media (prefers-color-scheme: dark) {
      #loading-splash { background: #0a0c10; color: #a5b4fc; }
    }
    #loading-splash .spinner {
      width: 28px; height: 28px;
      border: 3px solid rgba(99,102,241,0.15);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: ls-spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes ls-spin { to { transform: rotate(360deg); } }
    #loading-splash .brand {
      font-size: 20px; font-weight: 700; letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    #loading-splash .tagline {
      font-size: 11px; color: #94a3b8; font-weight: 500;
    }
  </style>
</head>
  <body>
<div id="loading-splash">
  <img src="/logo.png" alt="StudyFlow" style="width: 48px; height: 48px; margin-bottom: 20px; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;">
  <div class="brand">StudyFlow</div>
  <div class="tagline">Loading your focus session...</div>
</div>
<style>
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .7; transform: scale(0.95); }
}
</style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
