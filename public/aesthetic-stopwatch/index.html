<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Aesthetic Stopwatch | Study Flow</title>
  <meta name="description" content="A calm, aesthetic online stopwatch with animated wallpapers. Free and beautiful."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;background:#050508;color:#fff;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}

    #bg{position:fixed;inset:0;z-index:0;transition:background 1s ease}
    #bg::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.3);pointer-events:none}
    .bg-overlay{position:absolute;inset:0;pointer-events:none;transition:opacity 1s ease}
    .bg-overlay.hidden{opacity:0}

    #wordmark{position:fixed;top:24px;left:28px;z-index:10;font-size:10px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.25);user-select:none}

    #brush-btn{position:fixed;top:20px;right:24px;z-index:10;width:36px;height:36px;border-radius:12px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.4);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
    #brush-btn:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7)}
    #brush-btn svg{width:16px;height:16px}

    #wp-picker{position:fixed;top:64px;right:24px;z-index:10;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:12px;display:none;flex-direction:column;gap:6px;min-width:150px;box-shadow:0 12px 40px rgba(0,0,0,0.6)}
    #wp-picker.open{display:flex}
    #wp-picker button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:none;background:transparent;color:rgba(255,255,255,0.5);cursor:pointer;font-size:11px;font-weight:500;font-family:'Inter',sans-serif;transition:all 0.15s;text-align:left;width:100%}
    #wp-picker button:hover{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.8)}
    #wp-picker button.active{background:rgba(255,255,255,0.08);color:#fff}
    .wp-swatch{width:28px;height:28px;border-radius:8px;flex-shrink:0;border:1px solid rgba(255,255,255,0.06);overflow:hidden}

    #stopwatch{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;text-align:center;user-select:none}
    #stopwatch .time{font-weight:700;letter-spacing:-0.02em;line-height:1;color:rgba(255,255,255,0.92);text-shadow:0 2px 24px rgba(0,0,0,0.5),0 0 60px rgba(0,0,0,0.2)}
    #stopwatch .cs{font-weight:300;opacity:0.35}
    #stopwatch .status{font-size:10px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.2);margin-top:12px}

    #go-to-app{position:fixed;bottom:28px;right:28px;z-index:10;padding:8px 18px;border-radius:12px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.35);font-size:11px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    #go-to-app:hover{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.65)}

    /* Wallpapers */
    .wp-aurora{background:linear-gradient(135deg,#0d0d24,#1b0f3a,#0f0d2e,#1b0f3a,#0d0d24);background-size:400% 400%;animation:drift 12s ease-in-out infinite}
    .wp-aurora .bg-overlay{background:linear-gradient(180deg,transparent,rgba(129,140,248,0.06) 30%,rgba(167,139,250,0.04) 50%,transparent 70%);background-size:200% 200%;animation:aurora 8s ease-in-out infinite alternate}

    .wp-monolith{background:linear-gradient(135deg,#050508,#0f0f1a,#050508)}
    .wp-monolith .bg-overlay{top:45%;left:50%;width:50vmin;height:50vmin;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(129,140,248,0.08) 0%,rgba(99,102,241,0.03) 40%,transparent 70%);animation:breathe 6s ease-in-out infinite}

    .wp-wisp{background:linear-gradient(180deg,#0f0d0a,#1a1410,#0f0d0a)}
    .wp-wisp .bg-overlay{background:radial-gradient(ellipse at 50% 45%,rgba(245,158,11,0.06) 0%,transparent 60%)}
    .wisp-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
    .wisp-particle{position:absolute;border-radius:50%;filter:blur(1px);animation:float 10s ease-in-out infinite;opacity:0}
    .wisp-particle:nth-child(1){width:3px;height:3px;left:18%;background:rgba(245,158,11,0.4);animation-duration:9s;animation-delay:0s}
    .wisp-particle:nth-child(2){width:2px;height:2px;left:42%;background:rgba(245,158,11,0.3);animation-duration:11s;animation-delay:1.2s}
    .wisp-particle:nth-child(3){width:4px;height:4px;left:65%;background:rgba(245,158,11,0.5);animation-duration:8s;animation-delay:2.4s}
    .wisp-particle:nth-child(4){width:2px;height:2px;left:30%;background:rgba(245,158,11,0.35);animation-duration:13s;animation-delay:3.6s}
    .wisp-particle:nth-child(5){width:3px;height:3px;left:78%;background:rgba(245,158,11,0.3);animation-duration:10s;animation-delay:4.8s}
    .wisp-particle:nth-child(6){width:2px;height:2px;left:52%;background:rgba(245,158,11,0.45);animation-duration:7s;animation-delay:6s}
    .wisp-particle:nth-child(7){width:3px;height:3px;left:12%;background:rgba(245,158,11,0.25);animation-duration:12s;animation-delay:7.2s}
    .wisp-particle:nth-child(8){width:2px;height:2px;left:88%;background:rgba(245,158,11,0.4);animation-duration:9s;animation-delay:8.4s}

    @keyframes drift{0%,100%{background-position:0% 50%}25%{background-position:100% 0%}50%{background-position:50% 100%}75%{background-position:100% 50%}}
    @keyframes aurora{0%{opacity:0.4}100%{opacity:1}}
    @keyframes breathe{0%,100%{opacity:0.3;transform:translate(-50%,-50%) scale(1)}50%{opacity:0.7;transform:translate(-50%,-50%) scale(1.15)}}
    @keyframes float{0%,100%{transform:translateY(0) translateX(0);opacity:0}20%{opacity:0.7}50%{opacity:0.4}80%{opacity:0.6}100%{transform:translateY(-100px) translateX(20px);opacity:0}}

    @media (prefers-reduced-motion:reduce){
      #bg,.bg-overlay,.wisp-particle{animation:none!important;transition:none!important}
      .wp-aurora,.wp-wisp,.wp-monolith{animation:none!important}
      .wp-aurora{background:linear-gradient(135deg,#0d0d24,#1b0f3a)}
      .wp-wisp{background:linear-gradient(180deg,#0f0d0a,#1a1410)}
    }

    @media (max-width:480px){
      #stopwatch .time{font-size:clamp(2.4rem,14vw,4.5rem)!important}
      #wordmark{top:16px;left:18px;font-size:8px}
      #brush-btn{top:14px;right:14px;width:32px;height:32px}
      #wp-picker{top:52px;right:14px}
      #go-to-app{bottom:20px;right:16px;font-size:10px;padding:6px 14px}
    }
  </style>
</head>
<body>

  <!-- Wallpaper layer -->
  <div id="bg" class="wp-aurora">
    <div class="bg-overlay"></div>
    <div class="wisp-particles" style="display:none">
      <div class="wisp-particle"></div>
      <div class="wisp-particle"></div>
      <div class="wisp-particle"></div>
      <div class="wisp-particle"></div>
      <div class="wisp-particle"></div>
      <div class="wisp-particle"></div>
      <div class="wisp-particle"></div>
      <div class="wisp-particle"></div>
    </div>
  </div>

  <!-- Wordmark -->
  <div id="wordmark">Study Flow</div>

  <!-- Brush icon -->
  <button id="brush-btn" aria-label="Change wallpaper" onclick="togglePicker()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18.37 2.63 14 7l-1.59 1.59a2 2 0 0 0-.59 1.41V11a1 1 0 0 0 1 1h1a2 2 0 0 0 1.41-.59L21 8.63a3 3 0 0 0-2.63-5z"/>
      <path d="M9 13H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h4"/>
      <path d="M10 21a2 2 0 0 0 2-2v-4"/>
    </svg>
  </button>

  <!-- Wallpaper picker -->
  <div id="wp-picker">
    <button class="active" data-wp="aurora" onclick="setWallpaper('aurora')">
      <span class="wp-swatch" style="background:linear-gradient(135deg,#1a1a3e,#2d1b69,#1a1a3e)"></span>
      Aurora
    </button>
    <button data-wp="monolith" onclick="setWallpaper('monolith')">
      <span class="wp-swatch" style="background:linear-gradient(135deg,#0a0a0f,#16162a,#0a0a0f)"></span>
      Monolith
    </button>
    <button data-wp="wisp" onclick="setWallpaper('wisp')">
      <span class="wp-swatch" style="background:linear-gradient(180deg,#1a1410,#2d2018,#1a1410)"></span>
      Wisp
    </button>
  </div>

  <!-- Stopwatch -->
  <div id="stopwatch">
    <div class="time" id="time" style="font-size:clamp(3rem,14vw,8rem)">00:00</div>
    <div class="cs" id="cs" style="font-size:clamp(0.8rem,3.5vw,1.8rem)">.00</div>
    <div class="status" id="status">Ready</div>
  </div>

  <!-- Go to App -->
  <a id="go-to-app" href="/app/">Go to App →</a>

  <script>
    /* ─── Wallpaper switcher ─── */
    var currentWallpaper = localStorage.getItem('sf_landing_wp') || 'aurora';

    function togglePicker() {
      var p = document.getElementById('wp-picker');
      p.classList.toggle('open');
    }

    function setWallpaper(id) {
      var bg = document.getElementById('bg');
      bg.className = id === 'aurora' ? 'wp-aurora' : id === 'monolith' ? 'wp-monolith' : 'wp-wisp';
      var particles = bg.querySelector('.wisp-particles');
      if (particles) particles.style.display = id === 'wisp' ? 'block' : 'none';
      localStorage.setItem('sf_landing_wp', id);
      currentWallpaper = id;
      document.querySelectorAll('#wp-picker button').forEach(function(b) { b.classList.remove('active'); });
      var btn = document.querySelector('#wp-picker button[data-wp="' + id + '"]');
      if (btn) btn.classList.add('active');
      closePickerOutside();
    }

    function closePickerOutside() {
      var p = document.getElementById('wp-picker');
      if (p) p.classList.remove('open');
    }

    document.addEventListener('click', function(e) {
      var p = document.getElementById('wp-picker');
      var b = document.getElementById('brush-btn');
      if (p && p.classList.contains('open') && !p.contains(e.target) && !b.contains(e.target)) {
        p.classList.remove('open');
      }
    });

    // Restore saved wallpaper
    setWallpaper(currentWallpaper);

    /* ─── Stopwatch ─── */
    var sw = { elapsed: 0, running: false, cumulated: 0, runStart: 0, raf: null };
    var timeEl = document.getElementById('time');
    var csEl = document.getElementById('cs');
    var statusEl = document.getElementById('status');

    function pad2(n) { return n.toString().padStart(2, '0'); }

    function formatTime(s) {
      var h = Math.floor(s / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sec = Math.floor(s % 60);
      if (h > 0) return h + ':' + pad2(m) + ':' + pad2(sec);
      return pad2(m) + ':' + pad2(sec);
    }

    function tick() {
      var now = performance.now();
      var total = sw.cumulated + (now - sw.runStart) / 1000;
      sw.elapsed = total;
      var cs = Math.floor((total - Math.floor(total)) * 100);
      timeEl.textContent = formatTime(total);
      csEl.textContent = '.' + pad2(cs);
      sw.raf = requestAnimationFrame(tick);
    }

    function toggleStopwatch() {
      if (sw.running) {
        cancelAnimationFrame(sw.raf);
        sw.cumulated += (performance.now() - sw.runStart) / 1000;
        sw.running = false;
        statusEl.textContent = 'Paused';
      } else {
        if (sw.elapsed === 0) statusEl.textContent = 'Running';
        else statusEl.textContent = 'Running';
        sw.runStart = performance.now();
        sw.running = true;
        sw.raf = requestAnimationFrame(tick);
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.code === 'Space' && !e.repeat) { e.preventDefault(); toggleStopwatch(); }
    });

    document.getElementById('stopwatch').addEventListener('click', toggleStopwatch);
  </script>
</body>
</html>
